app = "medeligo-cancer-net"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SEARCH_PROVIDER = "perplexity"
  DEFAULT_SEARCH_LIMIT = "10"
  MAX_SEARCH_LIMIT = "10"
  HOST = "0.0.0.0"

[[services]]
  internal_port = 4321
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = "80"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = "443"

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"